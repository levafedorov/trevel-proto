<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LovEnRoute">
  <!-- Amber tile matching the site's primary colour (stone-free, reads well on
       both light and dark browser chrome). -->
  <rect width="64" height="64" rx="14" fill="#d97706"/>
  <!-- A route between two points: drawn as a path rather than a letter so the
       mark never depends on a font being available in the favicon context. -->
  <path d="M17 44c6-2 8-7 6-11s-6-6-4-11 8-6 14-4"
        fill="none" stroke="#fff" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="17" cy="44" r="5" fill="#fff"/>
  <circle cx="45" cy="19" r="5" fill="#fff"/>
</svg>
